name: build-release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels for supported CPython versions
        run: python -m pip install cibuildwheel && python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_TEST_COMMAND: >-
            python -c "from graphcore import END, Graph; g=Graph(); g.add_node('probe', lambda s,c: {'ok': True}); g.set_entry('probe').add_edge('probe', END); assert g.invoke().state['ok']; g.close()"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BUILD_VERBOSITY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: package-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build --sdist --outdir dist
      - run: python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  collect:
    name: collect and check release files
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install twine
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: graphcore-studio-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
